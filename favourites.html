<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourites</title>
    <link rel="stylesheet" href="favourites.css">
</head>

<body>
    <header class="header">
        <h1>APOD SEARCH</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Favourites</h2>

        <div class="favourites-grid">
            <div class="image-with-bookmark-button">
                <img src="./images/comet.jpg" alt="Comet">

                <img class="bookmark" src="./images/favouriteButton.svg" alt="favourite button">
            </div>

            <div class="image-with-bookmark-button">
                <img src="./images/galaxy.jpg" alt="A view of the galaxy">

                <img class="bookmark" src="./images/favouriteButton.svg" alt="favourite button">
            </div>

            <div class="image-with-bookmark-button">
                <img src="./images/space.jpg" alt="A sunset that turns into a view of space">

                <img class="bookmark" src="./images/favouriteButton.svg" alt="favourite button">
            </div>

            <div class="image-with-bookmark-button">
                <img src="./images/stars.jpg" alt="A view of spinning stars">

                <img class="bookmark" src="./images/favouriteButton.svg" alt="favourite button">
            </div>
        </div>

        <button class="nav-btn" onclick="location.href='index.html'">
            Home &#8250;
        </button>

    <footer class="footer">
        <p> Copyright 2025</p>
