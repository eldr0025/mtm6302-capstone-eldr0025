<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APOD Search</title>
    <link rel="stylesheet" href="home.css">
</head>

<body>
    <header class="header">
        <h1>APOD SEARCH</h1>
    </header>

    <!-- HOME PAGE SECTION -->
    <main id="home-section">
        <section class="hero">
            <img id="apod-image" src="./images/comet.jpg" alt="Comet C/2025 R2 (SWAN)">

            <div class="date-and-favourite">
                <button id="date-picker" class="date" type="button" aria-label="Pick a date">
                    <span id="selected-date" data-api-date="2025-09-18">September 18, 2025</span>
                    <span class="arrow">&#8964;</span>
                </button>

                <img id="save-favourite" class="bookmark" src="./images/favouriteButton.svg" alt="favourite button">
            </div>
        </section>
    
        <!-- Content pulled from API -->
        <section class="content">
            <h2 id="apod-title">Comet C/2025 R2 (SWAN)</h2>

            <p id="apod-description">
                Lorem ipsum dolor sit amet...
            </p>

            <button class="nav-btn" id="go-to-favourites">
                Favourites &#8250;
            </button>
        </section>
    </main>

    <!-- FAVOURITES PAGE SECTION (hidden until opened) -->
    <main id="favourites-section" class="hidden">
        <h2>Your Favourites</h2>
        <div id="favourites-grid"></div>
    </main>

    <footer class="footer">
        <p> Copyright 2025</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
